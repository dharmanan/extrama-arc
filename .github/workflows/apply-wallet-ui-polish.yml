name: Apply wallet UI polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-wallet-ui-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply Wallet UI polish
        run: python3 scripts/apply_wallet_ui_polish.py

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run check:all
          git diff --check

      - name: Commit to main
        run: |
          rm .github/workflows/apply-wallet-ui-polish.yml
          rm scripts/apply_wallet_ui_polish.py
          git config user.name "EXTREMA automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/wallet/page.tsx \
            app/i18n.tsx \
            app/globals.css \
            backend/scripts/verify-gateway-deposit.js \
            EXTREMA_ONCHAIN_EXECUTION_CHECKLIST.md \
            .github/workflows/apply-wallet-ui-polish.yml \
            scripts/apply_wallet_ui_polish.py
          git diff --cached --check
          git commit -m "fix: streamline wallet funding UI"
          git push origin HEAD:main
