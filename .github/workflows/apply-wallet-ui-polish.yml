name: Apply wallet UI polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-wallet-ui-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply focused Wallet UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing anchor: {label}")
              if text.count(old) != 1:
                  raise SystemExit(f"non-unique anchor: {label} ({text.count(old)})")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Wallet page: one source selector + stable inline deposit form,
          # address-row session action, no detached Session panel.
          # Financial handlers/recovery remain untouched.
          # ------------------------------------------------------------------
          path = Path('app/wallet/page.tsx')
          text = path.read_text()

          old_comment = '''  // The four funding source cards: Circle wallet readiness, source wallet USDC
          // and the approve/deposit action itself, each tracked per Gateway domain.
          // Distinct from the transfer signature above: this is what gets USDC into the
          // unified balance in the first place.'''
          new_comment = '''  // Funding source readiness and source-wallet USDC stay tracked per Gateway
          // domain, but the product presents one deliberate FROM selector instead of
          // four expanding cards. Deposit/recovery semantics remain per-domain.'''
          text = must_replace(text, old_comment, new_comment, 'wallet funding state comment')

          old_open_comment = '''  // Which card has its amount form open. Only one at a time: a deposit is a
          // financial action and the product asks for one deliberate choice.
          const [openSourceDomain, setOpenSourceDomain] = useState<number | null>(null);'''
          new_open_comment = '''  // Selected funding network. A durable deposit recovery overrides this value
          // and locks the selector to the already-submitted source domain.
          const [openSourceDomain, setOpenSourceDomain] = useState<number | null>(null);'''
          text = must_replace(text, old_open_comment, new_open_comment, 'selected funding domain state')

          old_destination = '''                        <select
                          value={selectedDestination ? String(selectedDestination.domain) : ""}
                          onChange={(event) => setGatewayDestinationDomain(event.target.value)}
                          disabled={gatewayFundingBusy || Boolean(gatewayFundingRecovery)}
                        >'''
          new_destination = '''                        <select
                          value={selectedDestination ? String(selectedDestination.domain) : ""}
                          onPointerDown={(event) => { event.currentTarget.dataset.pointerSelect = "true"; }}
                          onChange={(event) => {
                            setGatewayDestinationDomain(event.target.value);
                            if (event.currentTarget.dataset.pointerSelect === "true") {
                              delete event.currentTarget.dataset.pointerSelect;
                              event.currentTarget.blur();
                            }
                          }}
                          disabled={gatewayFundingBusy || Boolean(gatewayFundingRecovery)}
                        >'''
          text = must_replace(text, old_destination, new_destination, 'destination select focus behavior')

          insert_after = '''  const completedDepositAmount = depositCompleted && depositStatus
            ? formatGatewayUsdcDisplay(formatGatewayUsdcRaw(depositStatus.amountRaw), locale)
            : "";'''
          selected_logic = '''  const completedDepositAmount = depositCompleted && depositStatus
            ? formatGatewayUsdcDisplay(formatGatewayUsdcRaw(depositStatus.amountRaw), locale)
            : "";
          const selectedSourceDomain = activeDepositDomain
            ?? openSourceDomain
            ?? sourceState?.sources[0]?.domain
            ?? null;
          const selectedSource = sourceState?.sources.find((source) => source.domain === selectedSourceDomain)
            ?? sourceState?.sources[0]
            ?? null;
          const selectedSourceWalletStatus: SourceWalletStatus = selectedSource
            ? (sourceWalletStatus[selectedSource.domain] || "idle")
            : "idle";
          const selectedSourceNotice = selectedSource
            ? (sourceWalletNotice[selectedSource.domain] || "")
            : "";'''
          text = must_replace(text, insert_after, selected_logic, 'selected source derivation')

          old_address = '''              <div className="ex-wallet-address">
                <p className="ex-wallet-address__value ex-num">{walletAddress}</p>
                <button className="ex-btn ex-btn--ghost" type="button" onClick={copyExtremaAddress}>
                  {copiedAddress ? t.wallet.copied : t.wallet.copyAddress}
                </button>
              </div>'''
          new_address = '''              <div className="ex-wallet-address">
                <p className="ex-wallet-address__value ex-num">{walletAddress}</p>
                <div className="ex-wallet-address__actions">
                  <button className="ex-btn ex-btn--ghost" type="button" onClick={copyExtremaAddress}>
                    {copiedAddress ? t.wallet.copied : t.wallet.copyAddress}
                  </button>
                  <button className="ex-btn ex-btn--ghost" type="button" onClick={handleLock}>
                    {executionMode === "EXTERNAL_WALLET" ? t.wallet.disconnectWallet : t.wallet.disconnectSession}
                  </button>
                </div>
              </div>'''
          text = must_replace(text, old_address, new_address, 'address actions')

          start_marker = '                {/* B: fund the unified balance.'
          end_marker = '              <div className="ex-wallet-actions">'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('missing Gateway deposit section anchors')

          new_deposit = '''                {/* B: fund the unified balance. The same compact FROM / AVAILABLE /
                    AMOUNT interaction is used for Circle and external wallets. Circle
                    alone may require a companion wallet preparation step. */}
                <section className="ex-wallet-gateway" aria-label={t.wallet.gatewayDepositAriaLabel}>
                  <div>
                    <p className="ex-eyebrow">{t.wallet.gatewayAddTitle}</p>
                    <p>{t.wallet.gatewayAddBody}</p>
                  </div>

                  {sourceReadState === "error" ? (
                    <div>
                      <p className="ex-entry__msg" data-tone="error" aria-live="polite">
                        {t.wallet.gatewaySourceUnavailable}
                      </p>
                      <button
                        className="ex-btn ex-btn--ghost"
                        type="button"
                        onClick={() => void refreshSourceState()}
                      >
                        {t.wallet.gatewayRetry}
                      </button>
                    </div>
                  ) : sourceReadState !== "ready" || !sourceState || !selectedSource ? (
                    <p>{t.wallet.gatewaySourceReading}</p>
                  ) : (
                    <>
                      <div className="ex-gateway-deposit-controls">
                        <label>
                          <span>{t.wallet.gatewayFrom}</span>
                          <select
                            value={String(selectedSource.domain)}
                            onPointerDown={(event) => { event.currentTarget.dataset.pointerSelect = "true"; }}
                            onChange={(event) => {
                              const nextDomain = Number(event.target.value);
                              setOpenSourceDomain(nextDomain);
                              setDepositAmount("");
                              setDepositError("");
                              setDepositNotice("");
                              if (event.currentTarget.dataset.pointerSelect === "true") {
                                delete event.currentTarget.dataset.pointerSelect;
                                event.currentTarget.blur();
                              }
                            }}
                            disabled={depositBusy || depositAwaitingFinality || Boolean(depositRecovery)}
                          >
                            {sourceState.sources.map((source) => (
                              <option key={source.domain} value={source.domain}>{source.label}</option>
                            ))}
                          </select>
                        </label>

                        <div className="ex-gateway-deposit__available">
                          <span>{t.wallet.gatewayAvailable}</span>
                          <strong className="ex-num">
                            {executionMode === "CIRCLE_USER_WALLET" && selectedSourceWalletStatus === "missing"
                              ? t.wallet.gatewayWalletNotPrepared
                              : selectedSource.state === "error"
                                ? t.wallet.gatewaySourceUnavailable
                                : selectedSource.balanceRaw !== null
                                  ? `${formatGatewayUsdcDisplay(formatGatewayUsdcRaw(selectedSource.balanceRaw), locale)} USDC`
                                  : t.wallet.gatewaySourceReading}
                          </strong>
                        </div>

                        <label>
                          <span>{t.wallet.gatewayDepositAmount}</span>
                          <input
                            inputMode="decimal"
                            placeholder="0.00"
                            value={depositAmount}
                            onChange={(event) => setDepositAmount(event.target.value)}
                            disabled={
                              depositBusy || Boolean(depositRecovery) || depositAwaitingFinality ||
                              selectedSource.state === "error" ||
                              (executionMode === "CIRCLE_USER_WALLET" && selectedSourceWalletStatus !== "ready")
                            }
                          />
                        </label>

                        <div className="ex-gateway-deposit__action">
                          {executionMode === "CIRCLE_USER_WALLET" && selectedSourceWalletStatus === "missing" ? (
                            <button
                              className="ex-btn ex-btn--ink"
                              type="button"
                              onClick={() => void handlePrepareSourceWallet(selectedSource.domain)}
                            >
                              {selectedSourceNotice ? t.wallet.gatewayResumeSourceWallet : t.wallet.gatewayPrepareWallet}
                            </button>
                          ) : executionMode === "CIRCLE_USER_WALLET" && selectedSourceWalletStatus === "preparing" ? (
                            <button className="ex-btn ex-btn--ink" type="button" disabled>{t.wallet.gatewayPreparingWallet}</button>
                          ) : executionMode === "CIRCLE_USER_WALLET" && selectedSourceWalletStatus === "mismatch" ? (
                            <button className="ex-btn ex-btn--ghost" type="button" disabled>{t.wallet.gatewaySourceWalletMismatch}</button>
                          ) : executionMode === "CIRCLE_USER_WALLET" && selectedSourceWalletStatus === "error" ? (
                            <button
                              className="ex-btn ex-btn--ghost"
                              type="button"
                              onClick={() => void handlePrepareSourceWallet(selectedSource.domain)}
                            >
                              {t.wallet.gatewayRetry}
                            </button>
                          ) : depositCompleted ? (
                            <button
                              className="ex-btn ex-btn--ghost"
                              type="button"
                              onClick={() => handleAddMoreGatewayUsdc(selectedSource.domain)}
                            >
                              {t.wallet.gatewayAddMoreUsdc}
                            </button>
                          ) : (
                            <button
                              className="ex-btn ex-btn--ink"
                              type="button"
                              onClick={() => void handleGatewaySourceDeposit(selectedSource.domain)}
                              disabled={depositBusy || depositAwaitingFinality || selectedSource.state === "error"}
                            >
                              {depositBusy
                                ? (depositPhase === "preparingApproval" ? t.wallet.gatewayPreparingApproval
                                  : depositPhase === "confirmApproval" ? (executionMode === "CIRCLE_USER_WALLET" ? t.wallet.gatewayConfirmApprovalCircle : t.wallet.gatewayConfirmApprovalWallet)
                                  : depositPhase === "confirmDeposit" ? t.wallet.gatewayConfirmDeposit
                                  : depositPhase === "depositSubmitted" ? t.wallet.gatewayDepositSubmitted
                                  : depositPhase === "waitingFinality" ? t.wallet.gatewayWaitingFinality
                                  : depositRecovery ? t.wallet.gatewayRecoveringOperation
                                  : t.wallet.gatewayReading)
                                : depositRecovery
                                  ? t.wallet.gatewayResumeDeposit
                                  : t.wallet.gatewayAddToGateway}
                            </button>
                          )}
                        </div>
                      </div>

                      {selectedSourceNotice && (
                        <p className="ex-entry__msg" aria-live="polite">{selectedSourceNotice}</p>
                      )}

                      {depositCompleted && (
                        <div className="ex-gateway-deposit-complete" data-state="completed">
                          <p><span aria-hidden="true">✓</span>{withGatewayAmount(t.wallet.gatewayDepositAddedToGateway, completedDepositAmount)}</p>
                        </div>
                      )}

                      {depositAwaitingFinality && (
                        <div className="ex-gateway-finality" aria-live="polite">
                          <ol className="ex-gateway-finality__rail">
                            <li data-state="complete">{t.wallet.gatewayDepositSubmitted}</li>
                            <li data-state="active">
                              <span className="ex-gateway-finality__pulse" aria-hidden="true" />
                              {t.wallet.gatewayWaitingFinality}
                            </li>
                            <li data-state="pending">{t.wallet.gatewayBalanceAvailable}</li>
                          </ol>
                          <p>{t.wallet.gatewayFinalityAdvice}</p>
                          {depositStatusWarning && <small>{depositStatusWarning}</small>}
                        </div>
                      )}
                    </>
                  )}

                  {!depositCompleted && depositNotice && <p className="ex-entry__msg" data-tone="ok">{depositNotice}</p>}
                  {!depositCompleted && depositError && <p className="ex-entry__msg" data-tone="error">{depositError}</p>}
                </section>

'''
          text = text[:start] + new_deposit + text[end:]

          session_start = text.find('            <section className="ex-entry ex-wallet-session">')
          if session_start < 0:
              raise SystemExit('missing Session panel')
          session_end_marker = '            </section>\n          </div>'
          session_end = text.find(session_end_marker, session_start)
          if session_end < 0:
              raise SystemExit('missing Session panel end')
          session_end += len('            </section>\n')
          text = text[:session_start] + text[session_end:]

          path.write_text(text)

          # ------------------------------------------------------------------
          # i18n: source-row labels + external disconnect label.
          # ------------------------------------------------------------------
          path = Path('app/i18n.tsx')
          text = path.read_text()
          text = must_replace(
              text,
              '      gatewayAddBody: "Fund your unified balance from any supported wallet.",\n      gatewayAddUsdc: "Add USDC",',
              '      gatewayAddBody: "Fund your unified balance from any supported wallet.",\n      gatewayFrom: "From",\n      gatewayAvailable: "Available",\n      gatewayAddUsdc: "Add USDC",',
              'English Gateway source row copy',
          )
          text = must_replace(
              text,
              '      gatewayAddBody: "Birleşik Gateway bakiyeni desteklenen cüzdanlardan fonla.",\n      gatewayAddUsdc: "USDC ekle",',
              '      gatewayAddBody: "Birleşik Gateway bakiyeni desteklenen cüzdanlardan fonla.",\n      gatewayFrom: "Kaynak ağ",\n      gatewayAvailable: "Kullanılabilir",\n      gatewayAddUsdc: "USDC ekle",',
              'Turkish Gateway source row copy',
          )
          text = must_replace(
              text,
              '      disconnectSession: "Disconnect session",',
              '      disconnectSession: "End session",\n      disconnectWallet: "Disconnect wallet",',
              'English session action copy',
          )
          text = must_replace(
              text,
              '      disconnectSession: "Oturumu sonlandır",',
              '      disconnectSession: "Oturumu sonlandır",\n      disconnectWallet: "Cüzdan bağlantısını kes",',
              'Turkish session action copy',
          )
          path.write_text(text)

          # ------------------------------------------------------------------
          # CSS: appended overrides keep this UI-only change isolated from the
          # existing financial/status styles.
          # ------------------------------------------------------------------
          path = Path('app/globals.css')
          text = path.read_text()
          marker = '/* Wallet compact funding + stable header polish */'
          if marker in text:
              raise SystemExit('Wallet polish CSS already present')
          text += '''\n\n/* Wallet compact funding + stable header polish */
          .ex-wallet-ready{
            grid-template-columns:minmax(0,980px);
            justify-content:start;
            align-items:start;
          }
          .ex-wallet-ready__main{width:100%;max-width:980px}
          .ex-wallet-address__actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
          .ex-gateway-deposit-controls{
            display:grid;
            grid-template-columns:minmax(180px,1.2fr) minmax(140px,.72fr) minmax(150px,.9fr) auto;
            gap:12px;
            align-items:end;
          }
          .ex-gateway-deposit-controls label,
          .ex-gateway-deposit__available{display:grid;gap:7px;min-width:0}
          .ex-gateway-deposit-controls label>span,
          .ex-gateway-deposit__available>span{
            font-size:.68rem;
            letter-spacing:.12em;
            text-transform:uppercase;
            color:var(--muted);
          }
          .ex-gateway-deposit__available strong{
            min-height:42px;
            display:flex;
            align-items:center;
            font-size:.94rem;
            font-weight:500;
          }
          .ex-gateway-deposit__action{display:flex;align-items:flex-end;min-height:42px}
          .ex-gateway-deposit__action .ex-btn{white-space:nowrap;min-height:42px}
          .ex-wallet-gateway select:focus:not(:focus-visible){outline:0}
          .ex-wallet-gateway select:focus-visible{outline:1px solid var(--ink);outline-offset:1px}
          @media (min-width:1101px){
            .ex-header__aside>.ex-wallet{width:232px;justify-content:center;box-sizing:border-box;white-space:nowrap}
          }
          @media (max-width:820px){
            .ex-gateway-deposit-controls{grid-template-columns:repeat(2,minmax(0,1fr))}
            .ex-gateway-deposit__action{align-items:end}
          }
          @media (max-width:560px){
            .ex-gateway-deposit-controls{grid-template-columns:minmax(0,1fr)}
            .ex-wallet-address{align-items:flex-start}
            .ex-wallet-address__actions{width:100%}
          }
          '''
          path.write_text(text)

          # ------------------------------------------------------------------
          # Deterministic UI proof: replace old four-card assertions with the
          # new single selector/available/amount row while preserving all
          # recovery/finality safety assertions below it.
          # ------------------------------------------------------------------
          path = Path('backend/scripts/verify-gateway-deposit.js')
          text = path.read_text()
          b_start = text.find('  // B. The four funding source cards')
          d_start = text.find('  // D. Deposit recovery remains authoritative', b_start)
          if b_start < 0 or d_start < 0:
              raise SystemExit('missing old source-card test section')
          replacement = '''  // B. One compact funding-source selector
          // -------------------------------------------------------------------
          assert.match(depositMarkup, /t\\.wallet\\.gatewayAddTitle/);
          assert.match(depositMarkup, /t\\.wallet\\.gatewayAddBody/);
          assert.match(depositMarkup, /className="ex-gateway-deposit-controls"/);
          assert.match(depositMarkup, /<span>\\{t\\.wallet\\.gatewayFrom\\}<\\/span>/);
          assert.match(depositMarkup, /<span>\\{t\\.wallet\\.gatewayAvailable\\}<\\/span>/);
          assert.match(depositMarkup, /value=\\{String\\(selectedSource\\.domain\\)\\}/);
          assert.match(
            depositMarkup,
            /\\{sourceState\\.sources\\.map\\(\\(source\\) => \\(\\s*<option key=\\{source\\.domain\\} value=\\{source\\.domain\\}>\\{source\\.label\\}<\\/option>/,
            'the FROM selector is driven by the server-listed funding sources',
          );
          assert.match(
            depositMarkup,
            /formatGatewayUsdcDisplay\\(formatGatewayUsdcRaw\\(selectedSource\\.balanceRaw\\), locale\\)/,
            'AVAILABLE renders the selected source wallet balance only',
          );
          assert.ok(
            !depositMarkup.includes('transferableTotalUsdc') && !depositMarkup.includes('gateway.totalUsdc'),
            'the funding row must never present Gateway unified balance as source-wallet balance',
          );
          assert.match(depositMarkup, /selectedSource\\.state === "error"/);
          assert.match(depositMarkup, /selectedSource\\.balanceRaw !== null/);
          assert.match(depositMarkup, /t\\.wallet\\.gatewayWalletNotPrepared/);
          assert.match(depositMarkup, /handlePrepareSourceWallet\\(selectedSource\\.domain\\)/);
          assert.match(depositMarkup, /t\\.wallet\\.gatewaySourceWalletMismatch/);
          assert.match(depositMarkup, /handleGatewaySourceDeposit\\(selectedSource\\.domain\\)/);
          assert.match(
            depositMarkup,
            /disabled=\\{depositBusy \\|\\| depositAwaitingFinality \\|\\| Boolean\\(depositRecovery\\)\\}/,
            'a durable/in-flight deposit locks the FROM selector to its source domain',
          );

          // Finality remains status-only and compact beneath the fixed row.
          const railStart = depositMarkup.indexOf('className="ex-gateway-finality"');
          const railEnd = depositMarkup.indexOf('</div>', railStart);
          assert.ok(railStart > -1 && railEnd > railStart);
          const railMarkup = depositMarkup.slice(railStart, railEnd);
          assert.match(railMarkup, /gatewayDepositSubmitted/);
          assert.match(railMarkup, /gatewayWaitingFinality/);
          assert.match(railMarkup, /gatewayBalanceAvailable/);
          assert.match(railMarkup, /data-state="active"/);
          assert.match(railMarkup, /ex-gateway-finality__pulse/);
          assert.match(railMarkup, /data-state="pending"/);
          assert.ok(!/attestation|mint|countdown|progress|%/i.test(railMarkup));
          assert.match(styles, /animation:ex-gateway-finality-breathe/);
          assert.match(styles, /@media \\(prefers-reduced-motion: reduce\\)[\\s\\S]{0,180}animation:none/);

          // The funding interaction is one fixed row, not four expanding cards.
          assert.match(styles, /\\.ex-gateway-deposit-controls\\{/);
          assert.match(styles, /grid-template-columns:minmax\\(180px,1\\.2fr\\)/);
          assert.ok(!depositMarkup.includes('className="ex-gateway-sources"'));
          assert.ok(!depositMarkup.includes('className="ex-gateway-source"'));

          // Completed state keeps the same selected source and offers Add more.
          assert.match(depositMarkup, /depositCompleted && \\(/);
          assert.match(depositMarkup, /gatewayDepositAddedToGateway/);
          assert.match(depositMarkup, /gatewayAddMoreUsdc/);

          // -------------------------------------------------------------------
          '''
          text = text[:b_start] + replacement + text[d_start:]

          # Old add-more assertion was card-specific; new control uses selectedSource.
          text = text.replace(
              'assert.match(depositMarkup, /onClick=\\{\\(\\) => handleAddMoreGatewayUsdc\\(source\\.domain\\)\\}/);',
              'assert.match(depositMarkup, /onClick=\\{\\(\\) => handleAddMoreGatewayUsdc\\(selectedSource\\.domain\\)\\}/);',
          )
          text = text.replace("console.log('GATEWAY_SOURCE_CARDS_UI=PASS');", "console.log('GATEWAY_SOURCE_SELECTOR_UI=PASS');")
          text = text.replace("console.log('GATEWAY_RESPONSIVE_SOURCE_LAYOUT=PASS');", "console.log('GATEWAY_SOURCE_ROW_LAYOUT=PASS');")
          path.write_text(text)

          # ------------------------------------------------------------------
          # Checklist: product-only presentation update, no new live proof.
          # ------------------------------------------------------------------
          path = Path('EXTREMA_ONCHAIN_EXECUTION_CHECKLIST.md')
          text = path.read_text()
          text = text.replace(
              '- Only the card owning an in-flight deposit shows its finality rail. While a deposit is in flight every other card is locked, so a second deposit is never started from another chain, automatically or otherwise.\n- Responsive layout: four cards in one row on a desktop, two by two at medium widths, one column on a phone.',
              '- Gateway source funding now uses one compact `FROM / AVAILABLE / AMOUNT` row driven by the server-listed Base/OP/Arbitrum/Ethereum sources. Circle and external wallets share the same layout; only Circle can surface `Prepare wallet`. A durable/in-flight deposit locks `FROM` to its recorded source domain, so a second deposit is never started on another chain.\n- The old four expanding source cards are removed. Funding controls stay in a stable row (2x2 at medium widths, one column on phone); finality remains the compact status rail below the row.',
          )
          text = text.replace('`GATEWAY_SOURCE_CARDS_UI=PASS`', '`GATEWAY_SOURCE_SELECTOR_UI=PASS`')
          text = text.replace('`GATEWAY_RESPONSIVE_SOURCE_LAYOUT=PASS`', '`GATEWAY_SOURCE_ROW_LAYOUT=PASS`')
          path.write_text(text)

          # Final source assertions before installing/running tests.
          page = Path('app/wallet/page.tsx').read_text()
          assert 'className="ex-gateway-sources"' not in page
          assert 'className="ex-entry ex-wallet-session"' not in page
          assert 'className="ex-gateway-deposit-controls"' in page
          assert 't.wallet.disconnectWallet' in page
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run authoritative checks
        run: npm run check:all

      - name: Diff safety
        run: git diff --check

      - name: Commit Wallet UI polish to main
        shell: bash
        run: |
          rm .github/workflows/apply-wallet-ui-polish.yml
          git config user.name "EXTREMA automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/wallet/page.tsx \
            app/i18n.tsx \
            app/globals.css \
            backend/scripts/verify-gateway-deposit.js \
            EXTREMA_ONCHAIN_EXECUTION_CHECKLIST.md \
            .github/workflows/apply-wallet-ui-polish.yml
          git diff --cached --check
          git commit -m "fix: streamline wallet funding UI"
          git push origin HEAD:main
