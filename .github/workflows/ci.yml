name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Secret scan
        run: node backend/scripts/verify-no-committed-secrets.js

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install frontend
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Install backend
        run: npm --prefix backend install

      - name: Check backend
        run: npm run backend:check

      - name: Final E2E harness
        run: npm --prefix backend run verify:e2e
